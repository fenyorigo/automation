<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10251f"><title>Felhasználók – Otthonklíma</title><link rel="stylesheet" href="{{ url_for('static',filename='dashboard.css') }}"></head><body>
<header class="topbar history-topbar"><div><p class="eyebrow">Hozzáférés-kezelés</p><h1>Felhasználók</h1></div><a class="back-link" href="{{ url_for('dashboard') }}">Vissza az áttekintőhöz</a>{% include '_account_menu.html' %}</header><main>
{% if user_notice %}<p class="poll-notice {{ user_notice.kind }}">{{ user_notice.message }}</p>{% endif %}
<section class="history-panel"><h2>Új felhasználó</h2><form class="user-create-form" method="post" action="{{ url_for('create_user') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Felhasználónév<input name="username" minlength="3" maxlength="64" pattern="[A-Za-z0-9._-]+" required></label><label>Jelszó<input type="password" name="password" minlength="10" autocomplete="new-password" required></label><label>Jogosultság<select name="role"><option value="viewer">Csak olvasó</option><option value="editor">Szerkesztő</option></select></label><button type="submit">Létrehozás</button></form></section>
<section class="history-panel"><h2>Meglévő felhasználók</h2><div class="user-list">{% for user in users %}<form method="post" action="{{ url_for('update_user',user_id=user.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div><strong>{{ user.username }}</strong><small>Utolsó belépés: {{ user.last_login_at|local_time }}</small></div><label>Jogosultság<select name="role"><option value="viewer" {{ 'selected' if user.role=='viewer' }}>Csak olvasó</option><option value="editor" {{ 'selected' if user.role=='editor' }}>Szerkesztő</option></select></label><label class="active-user"><input type="checkbox" name="is_active" value="1" {{ 'checked' if user.is_active }}> Aktív</label><label>Új jelszó<input type="password" name="password" minlength="10" placeholder="változatlan" autocomplete="new-password"></label><button type="submit">Mentés</button></form>{% endfor %}</div></section>
</main></body></html>
