<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10251f"><title>Bejelentkezés – Otthonklíma</title><link rel="stylesheet" href="{{ url_for('static',filename='dashboard.css') }}"></head>
<body class="auth-page"><main class="auth-shell"><section class="auth-card"><p class="eyebrow">Otthoni automatizálás</p><h1>Bejelentkezés</h1><p class="auth-intro">Az Otthonklíma adatai bejelentkezés után érhetők el.</p>
{% if error %}<p class="poll-notice error" role="alert">{{ error }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="next" value="{{ next_url }}">
<label>Felhasználónév<input name="username" autocomplete="username" required autofocus></label><label>Jelszó<input type="password" name="password" autocomplete="current-password" required></label><button type="submit">Belépés</button></form></section></main></body></html>
